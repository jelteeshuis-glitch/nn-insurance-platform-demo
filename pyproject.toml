[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nn-insurance-platform-demo"
version = "1.0.0"
description = "NN Insurance Claims Platform — Legacy Modernization Demo"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "COG GTM", email = "gtm@cognition.ai"},
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "bandit>=1.7",
    "ruff>=0.1",
]

[tool.setuptools.packages.find]
include = ["legacy*", "modernized*", "governance*"]

[tool.pytest.ini_options]
testpaths = ["legacy/tests", "modernized/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "S", "B"]
ignore = ["S101"]  # Allow assert in tests

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom requires `Depends()` in argument
# defaults, which is safe here (not a mutable default) but trips B008.
"modernized/services/*/api.py" = ["B008"]
# Test fixtures/vars use benign literals that trip hardcoded-secret heuristics.
"modernized/tests/*" = ["S105", "S106"]

[tool.coverage.run]
source = ["legacy/src", "modernized", "governance"]

[tool.coverage.report]
fail_under = 80
show_missing = true
